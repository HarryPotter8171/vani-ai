name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

env:
  NODE_VERSION: '22'

jobs:
  # --- Backend: unit + integration + security (blocking) ---------------------
  backend-tests:
    name: Backend tests (unit, integration, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        env:
          # Integration tests do not launch Chromium; skip the ~150MB download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      # mongodb-memory-server downloads its own mongod binary on first run
      # (no system mongod on the runner) — cache it across runs/branches.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Run unit, integration & security tests (with coverage)
        working-directory: backend
        run: npm run test:ci

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

  # --- Backend: performance benchmarks (informational, non-blocking) --------
  # Timing assertions are inherently sensitive to shared-runner CPU/IO
  # variance, so this job is allowed to fail without blocking the pipeline.
  # See TEST_REPORT.md "Remaining risks" for details.
  backend-performance:
    name: Backend performance benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        env:
          # Integration tests do not launch Chromium; skip the ~150MB download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Run performance benchmarks
        working-directory: backend
        run: npm run test:performance

  # --- Frontend: unit + component tests --------------------------------------
  frontend-tests:
    name: Frontend tests (unit & components)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests (with coverage)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

  # --- Build: backend syntax check + frontend production build --------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        env:
          # Integration tests do not launch Chromium; skip the ~150MB download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Backend build check
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5057/api
        run: npm run build

      - name: Enforce first-load JS budget (≤ 1.8 MB)
        working-directory: frontend
        run: npm run bundle:budget

  # --- End-to-end: full user journey through the real app stack -------------
  e2e-tests:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root (Playwright) dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        env:
          # Integration tests do not launch Chromium; skip the ~150MB download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end user journey
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
